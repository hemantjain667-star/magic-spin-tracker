name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Build web app
        run: |
          cat << 'EOF' > fix-entry.mjs
          import fs from 'fs';

          if (fs.existsSync('vite.config.ts')) {
            let v = fs.readFileSync('vite.config.ts', 'utf8');
            if (!v.includes('base:')) {
              v = v.replace('defineConfig({', "defineConfig({\n  base: './',");
              fs.writeFileSync('vite.config.ts', v);
            }
          }

          if (fs.existsSync('src/main.tsx')) {
            let m = fs.readFileSync('src/main.tsx', 'utf8');
            const hook = [
              "window.addEventListener('error', (e) => {",
              "  const pre = document.createElement('pre');",
              "  pre.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#1a0505;color:#ff8080;padding:16px;font-size:12px;white-space:pre-wrap;overflow:auto;';",
              "  pre.textContent = ['ERR: ' + (e.message || ''), e.error && e.error.stack ? e.error.stack : ''].join('\\n');",
              "  document.body.appendChild(pre);",
              "});",
              "window.addEventListener('unhandledrejection', (e) => {",
              "  const pre = document.createElement('pre');",
              "  pre.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#1a0505;color:#ff8080;padding:16px;font-size:12px;white-space:pre-wrap;overflow:auto;';",
              "  pre.textContent = ['PROMISE: ', e.reason && e.reason.stack ? e.reason.stack : String(e.reason)].join('\\n');",
              "  document.body.appendChild(pre);",
              "});"
            ].join('\n');
            fs.writeFileSync('src/main.tsx', hook + '\n' + m);
          }
          EOF
          node fix-entry.mjs
          npm run build

      - name: Setup Capacitor Android
        run: |
          node -e "
            const fs = require('fs');
            fs.writeFileSync('capacitor.config.json', JSON.stringify({
              appId: 'com.hemantjain.magicspintracker',
              appName: 'Magic Spin Tracker',
              webDir: 'dist'
            }, null, 2));
          "
          npx cap add android
          node -e "
            const fs = require('fs');
            const path = require('path');

            const p = 'android/variables.gradle';
            if (fs.existsSync(p)) {
              let c = fs.readFileSync(p, 'utf8');
              c = c.replace(/compileSdkVersion\s*=\s*\d+/, 'compileSdkVersion = 34');
              c = c.replace(/targetSdkVersion\s*=\s*\d+/, 'targetSdkVersion = 34');
              c = c.replace(/minSdkVersion\s*=\s*\d+/, 'minSdkVersion = 22');
              fs.writeFileSync(p, c);
            }

            const appGradle = 'android/app/build.gradle';
            if (fs.existsSync(appGradle)) {
              let g = fs.readFileSync(appGradle, 'utf8');
              const fixBlock = \`
              configurations.all {
                exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
                resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                }
              }
              \`;
              g = g.replace('android {', fixBlock + '\nandroid {');
              fs.writeFileSync(appGradle, g);
            }

            const pkgDir = 'android/app/src/main/java/com/hemantjain/magicspintracker';
            fs.mkdirSync(pkgDir, { recursive: true });
            for (const fname of ['FloatingOverlayService.java', 'FloatingOverlayPlugin.java']) {
              const srcFile = path.join('native-overlay', fname);
              if (fs.existsSync(srcFile)) {
                fs.copyFileSync(srcFile, path.join(pkgDir, fname));
              }
            }

            const mainActivityPath = path.join(pkgDir, 'MainActivity.java');
            if (fs.existsSync(mainActivityPath)) {
              let ma = fs.readFileSync(mainActivityPath, 'utf8');
              if (!ma.includes('registerPlugin(FloatingOverlayPlugin.class)')) {
                ma = ma.replace(
                  'super.onCreate(savedInstanceState);',
                  'super.onCreate(savedInstanceState);\n    registerPlugin(FloatingOverlayPlugin.class);'
                );
                fs.writeFileSync(mainActivityPath, ma);
              }
            }

            const manifestPath = 'android/app/src/main/AndroidManifest.xml';
            if (fs.existsSync(manifestPath)) {
              let mf = fs.readFileSync(manifestPath, 'utf8');
              if (!mf.includes('android.permission.SYSTEM_ALERT_WINDOW')) {
                mf = mf.replace(
                  '<manifest',
                  '<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"'
                );
                mf = mf.replace(
                  '<application',
                  '<uses-permission android:name=\"android.permission.SYSTEM_ALERT_WINDOW\" />\n\n    <application'
                );
              }
              if (!mf.includes('FloatingOverlayService')) {
                mf = mf.replace(
                  '</application>',
                  '        <service\n            android:name=\".FloatingOverlayService\"\n            android:enabled=\"true\"\n            android:exported=\"false\" />\n    </application>'
                );
              }
              fs.writeFileSync(manifestPath, mf);
            }
          "
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: magic-spin-tracker-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
