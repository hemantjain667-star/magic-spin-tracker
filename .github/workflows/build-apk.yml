name: Build Magic Spin Tracker APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & Build Web App
        run: |
          rm -f package-lock.json
          npm install
          npm install @capacitor/core@6.1.2 @capacitor/android@6.1.2 @capacitor/cli@6.1.2
          rm -f capacitor.config.ts
          printf '{\n  "appId": "com.hemantjain.magicspintracker",\n  "appName": "Magic Spin Tracker",\n  "webDir": "dist",\n  "android": { "allowMixedContent": true }\n}\n' > capacitor.config.json
          npm run build

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Copy Native Overlay + OCR Java files & Patch Android Config
        run: |
          PKG_DIR="android/app/src/main/java/com/hemantjain/magicspintracker"
          mkdir -p "$PKG_DIR"
          cp native-overlay/FloatingOverlayPlugin.java "$PKG_DIR/"
          cp native-overlay/FloatingOverlayService.java "$PKG_DIR/"

          printf 'package com.hemantjain.magicspintracker;\n\nimport android.os.Bundle;\nimport com.getcapacitor.BridgeActivity;\n\npublic class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(Bundle savedInstanceState) {\n        registerPlugin(FloatingOverlayPlugin.class);\n        super.onCreate(savedInstanceState);\n    }\n}\n' > "$PKG_DIR/MainActivity.java"

          node -e '
            const fs = require("fs");

            const gradlePath = "android/app/build.gradle";
            let gradle = fs.readFileSync(gradlePath, "utf8");
            if (!gradle.includes("com.google.mlkit:text-recognition")) {
              gradle = gradle.replace(
                /dependencies\s*\{/,
                "dependencies {\n    implementation \"com.google.mlkit:text-recognition:16.0.1\""
              );
              fs.writeFileSync(gradlePath, gradle, "utf8");
            }

            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let manifest = fs.readFileSync(manifestPath, "utf8");

            const perms = [
              "android.permission.SYSTEM_ALERT_WINDOW",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION",
              "android.permission.FOREGROUND_SERVICE_SPECIAL_USE",
              "android.permission.POST_NOTIFICATIONS"
            ];
            let permXml = "";
            for (const p of perms) {
              if (!manifest.includes(p)) {
                permXml += `    <uses-permission android:name="${p}" />\n`;
              }
            }
            if (permXml) {
              manifest = manifest.replace("</manifest>", permXml + "</manifest>");
            }

            if (!manifest.includes("FloatingOverlayService")) {
              const serviceXml = `        <service\n            android:name=".FloatingOverlayService"\n            android:enabled="true"\n            android:exported="false"\n            android:foregroundServiceType="mediaProjection|specialUse">\n            <property\n                android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"\n                android:value="Floating roulette spin tracker overlay" />\n        </service>\n`;
              manifest = manifest.replace("</application>", serviceXml + "    </application>");
            }
            fs.writeFileSync(manifestPath, manifest, "utf8");
          '

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: Magic-Spin-Tracker-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
