name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Setup Capacitor Android
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Magic Spin Tracker" com.hemantjain.magicspintracker --web-dir=dist
          npx cap add android
          node -e "
            const fs = require('fs');
            const p = 'android/variables.gradle';
            if (fs.existsSync(p)) {
              let c = fs.readFileSync(p, 'utf8');
              c = c.replace(/compileSdkVersion\s*=\s*\d+/, 'compileSdkVersion = 34');
              c = c.replace(/targetSdkVersion\s*=\s*\d+/, 'targetSdkVersion = 34');
              c = c.replace(/minSdkVersion\s*=\s*\d+/, 'minSdkVersion = 22');
              fs.writeFileSync(p, c);
            }
            const appGradle = 'android/app/build.gradle';
            if (fs.existsSync(appGradle)) {
              let g = fs.readFileSync(appGradle, 'utf8');
              const fixBlock = \`
              configurations.all {
                exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
                resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                }
              }
              \`;
              g = g.replace('android {', fixBlock + '\nandroid {');
              fs.writeFileSync(appGradle, g);
            }
          "
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: magic-spin-tracker-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
